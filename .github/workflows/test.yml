name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install r2r==3.6.6 mcp>=1.26.0 httpx pydantic pytest pytest-asyncio>=1.3.0

      - name: Run tests
        run: |
          pytest test_r2r_mcp_wrapper.py test_verification_d2.py -v
          pytest mcp-servers/sourcebooks/test_server.py mcp-servers/sourcebooks/test_verification_d3.py -v
