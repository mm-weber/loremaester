# DEFERRED TO v0.2 — intentionally inactive for the v0.1 release.
#
# v0.1 ships container images pinned by sha256 digest (the compose stacks + the
# devcontainer base) but WITHOUT automated updates. Dependabot — which would open
# reviewable PRs to bump those digests/tags and the GitHub Actions — is parked
# until v0.2 to keep the first release's scope small.
#
# Tracked as "R-5 — Supply-chain auto-updates (Dependabot)" in the v0.2 roadmap.
#
# TO PICK IT UP (v0.2):
#   1. Uncomment the version:/updates: block below.
#   2. Ensure this file is on the DEFAULT branch — Dependabot only reads it there.
#   3. Repo → Settings → Code security → enable "Dependabot version updates"
#      (and ideally "Dependabot alerts" + "security updates").
#   Caveat: the docker ecosystem auto-tracks the Dockerfile + the standard-named
#   docker/compose.yaml only. compose.full.yaml / compose.app.yaml /
#   compose.infra.yaml use non-standard filenames and need a manual re-pin
#   (`docker buildx imagetools inspect <ref>` → update the image: line).
# ─────────────────────────────────────────────────────────────────────────────

