volumes:
  hatchet_certs:
    name: hatchet_certs
  hatchet_config:
    name: hatchet_config
  hatchet_api_key:
    name: hatchet_api_key
  hatchet_rabbitmq_data:
    name: hatchet_rabbitmq_data
  hatchet_rabbitmq_conf:
    name: hatchet_rabbitmq_conf
  hatchet_postgres_data:
    name: hatchet_postgres_data
  minio_data:
    name: minio_data
  postgres_data:
    name: postgres_data

services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: [postgres]
    env_file:
      - ./env/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # loopback-only: internal to the stack (off the host LAN).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure
    command: >
      postgres
      -c max_connections=1024

  minio:
    image: minio/minio
    profiles: [minio]
    env_file:
      - ./env/minio.env
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure
    command: server /data --console-address ":9001"

  hatchet-postgres:
    image: postgres:latest
    env_file:
      - ./env/hatchet.env
    volumes:
      - hatchet_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hatchet_user -d hatchet"]
      interval: 10s
      timeout: 5s
      retries: 5


  hatchet-rabbitmq:
    image: "rabbitmq:3-management"
    hostname: "hatchet-rabbitmq"
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    env_file:
      - ./env/hatchet.env
    volumes:
      - hatchet_rabbitmq_data:/var/lib/rabbitmq
      - hatchet_rabbitmq_conf:/etc/rabbitmq/rabbitmq.conf
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 5

  hatchet-create-db:
    image: postgres:latest
    command: sh /scripts/create-hatchet-db.sh
    volumes:
      - ./scripts:/scripts
    env_file:
      - ./env/hatchet.env
    depends_on:
      hatchet-postgres:
        condition: service_healthy

  hatchet-migration:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-migrate:v0.53.15
    env_file:
      - ./env/hatchet.env
    depends_on:
      hatchet-create-db:
        condition: service_completed_successfully

  hatchet-setup-config:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-admin:v0.53.15
    command: /hatchet/hatchet-admin quickstart --skip certs --generated-config-dir /hatchet/config --overwrite=false
    env_file:
      - ./env/hatchet.env
    volumes:
      - hatchet_certs:/hatchet/certs
      - hatchet_config:/hatchet/config
    depends_on:
      hatchet-migration:
        condition: service_completed_successfully
      hatchet-rabbitmq:
        condition: service_healthy

  hatchet-engine:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-engine:v0.53.15
    command: /hatchet/hatchet-engine --config /hatchet/config
    restart: on-failure
    depends_on:
      hatchet-setup-config:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:7077:7077"
    env_file:
      - ./env/hatchet.env
    volumes:
      - hatchet_certs:/hatchet/certs
      - hatchet_config:/hatchet/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8733/live"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  hatchet-dashboard:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-dashboard:v0.53.15
    command: sh ./entrypoint.sh --config /hatchet/config
    restart: on-failure
    depends_on:
      hatchet-setup-config:
        condition: service_completed_successfully
    env_file:
      - ./env/hatchet.env
    volumes:
      - hatchet_certs:/hatchet/certs
      - hatchet_config:/hatchet/config
    ports:
      - "127.0.0.1:7274:80"

  setup-token:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-admin:v0.53.15
    command: sh /scripts/setup-token.sh
    volumes:
      - ./scripts:/scripts
      - hatchet_certs:/hatchet/certs
      - hatchet_config:/hatchet/config
      - hatchet_api_key:/hatchet_api_key
    depends_on:
      hatchet-setup-config:
        condition: service_completed_successfully

  unstructured:
    image: ragtoriches/unst-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7275/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  graph_clustering:
    image: ragtoriches/cluster-prod
    ports:
      - "127.0.0.1:7276:7276"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7276/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Init container: gate r2r startup on hatchet-engine's gRPC port (7077)
  # being reachable. hatchet-engine's own healthcheck (further up) only
  # probes HTTP /live on 8733, not 7077 — so `service_healthy` on
  # hatchet-engine doesn't imply gRPC is ready. Without this gate, r2r
  # races Hatchet's gRPC bind on every start, fails register_workflow with
  # `_InactiveRpcError: Connection refused`, and SystemExit(1)s into a
  # restart loop. This container polls 7077 with `nc -z` until TCP accepts,
  # then exits 0 — and r2r's depends_on (below) gates on that exit.
  #
  # The gate below is `service_started`, NOT `service_healthy`. Gating
  # the gRPC poll on the HTTP /live healthcheck would re-introduce the
  # very fragility this sidecar exists to bypass: if /live is slow to
  # pass or flaps, the gRPC poll never even starts and compose hangs at
  # "Waiting 300s+". The TCP poll below IS the readiness check — Docker
  # just needs hatchet-engine's container to exist so DNS resolves the
  # name. Do not "fix" this back to service_healthy.
  #
  # The loop is bounded to 300s; on timeout it exits 1, failing r2r's
  # `service_completed_successfully` gate fast (with a logline) rather
  # than hanging indefinitely if hatchet-engine never binds 7077.
  wait-for-hatchet-grpc:
    image: alpine:latest
    # Compose interpolates ${VAR} in YAML values, so shell variables here
    # need $$ to survive (${i} → $${i}). Using exec-form + literal `|`
    # block keeps newlines so the if/then/fi parses correctly.
    command:
      - sh
      - -c
      - |
        for i in $$(seq 1 300); do
          if nc -z hatchet-engine 7077; then
            echo "hatchet gRPC reachable after $${i}s"
            exit 0
          fi
          echo "waiting for hatchet gRPC on 7077... ($${i}/300)"
          sleep 1
        done
        echo "TIMEOUT: hatchet gRPC not reachable after 300s" >&2
        exit 1
    depends_on:
      hatchet-engine:
        condition: service_started
    restart: "no"

  r2r:
    image: sciphiai/r2r:latest
    ports:
      # loopback (host localhost) + docker-bridge gateway (the devcontainer,
      # via host.docker.internal) — NOT 0.0.0.0, so the host's LAN interface is
      # not exposed. macOS/Docker Desktop: drop the 172.17.0.1 line (it errors
      # there; 127.0.0.1 suffices). Verify the gateway from inside the
      # container with `getent hosts host.docker.internal`.
      - "127.0.0.1:7272:7272"
      - "172.17.0.1:7272:7272"
    env_file:
      - ./env/r2r-full.env
    command: sh /scripts/start-r2r.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7272/v3/health"]
      interval: 6s
      timeout: 5s
      retries: 5
    restart: on-failure
    volumes:
      - ./user_configs:/app/user_configs
      - ./user_tools:/app/user_tools
      - hatchet_api_key:/hatchet_api_key:ro
      - ./scripts:/scripts
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
      setup-token:
        condition: service_completed_successfully
      unstructured:
        condition: service_healthy
      graph_clustering:
        condition: service_healthy
      wait-for-hatchet-grpc:
        condition: service_completed_successfully

  r2r-dashboard:
    image: sciphiai/r2r-dashboard:1.0.3
    env_file:
      - ./env/r2r-dashboard.env
    ports:
      - "127.0.0.1:7273:3000"
