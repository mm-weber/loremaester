# Per-instance R2R application stack.
# Requires compose.infra.yaml to be running first (r2r-infra network + hatchet_api_key volume).
#
# Setup:
#   cp instances/ttrpg/.env.example instances/ttrpg/.env   # then customize
#
# Usage:
#   docker compose -f compose.app.yaml --env-file instances/ttrpg/.env up -d
#   docker compose -f compose.app.yaml --env-file instances/coding/.env up -d

services:
  unstructured:
    image: ragtoriches/unst-prod:latest@sha256:6efd836062aa8bedc5d88e9733096e2a52a9d83bb2717a82aca7468e3e97e52c
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7275/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  graph_clustering:
    image: ragtoriches/cluster-prod:latest@sha256:53bcbcc114fe08906b6df6b4d3863644145b1efa240fd6643ef65986593938b6
    ports:
      - "${GRAPH_CLUSTERING_PORT:-7276}:7276"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7276/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  r2r:
    image: sciphiai/r2r:latest@sha256:f7f7ee5ef3aa0945895320eb7424cb7e2f89e455b6a6a20ec5aff6de3024b88c
    ports:
      - "${R2R_PORT:-7272}:${R2R_PORT:-7272}"
    env_file:
      - ./env/r2r-full.env
    environment:
      # Instance-specific overrides (take precedence over env_file)
      - R2R_PORT=${R2R_PORT:-7272}
      - R2R_HOST=0.0.0.0
      - R2R_PROJECT_NAME=${R2R_PROJECT_NAME:-r2r_default}
      - R2R_CONFIG_PATH=/app/user_configs/${R2R_CONFIG_FILE:-r2r-ollama-embeddings.toml}
      # Shared infra (reached via r2r-infra network)
      - R2R_POSTGRES_HOST=postgres
      - R2R_POSTGRES_PORT=5432
      # Local services (reached via default project network)
      - UNSTRUCTURED_SERVICE_URL=http://unstructured:7275
      - CLUSTERING_SERVICE_URL=http://graph_clustering:7276
      # Hatchet
      - HATCHET_CLIENT_TLS_STRATEGY=none
    command: sh /scripts/start-r2r.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${R2R_PORT:-7272}/v3/health"]
      interval: 6s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure
    volumes:
      - ./instances/${INSTANCE}/user_configs:/app/user_configs
      - ./user_tools:/app/user_tools
      - hatchet_api_key:/hatchet_api_key:ro
      - ./scripts:/scripts
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - default
      - r2r-infra
    depends_on:
      unstructured:
        condition: service_healthy
      graph_clustering:
        condition: service_healthy

  r2r-dashboard:
    image: sciphiai/r2r-dashboard:1.0.3@sha256:ba9bcb43c5e7d7d4eb9fe38970f976f6a0842297f3da078cb6223d1f078741d1
    environment:
      - NEXT_PUBLIC_R2R_DEPLOYMENT_URL=http://localhost:${R2R_PORT:-7272}
      - NEXT_PUBLIC_HATCHET_DASHBOARD_URL=http://localhost:7274
      - NEXT_PUBLIC_R2R_DEFAULT_EMAIL=admin@example.com
      - NEXT_PUBLIC_R2R_DEFAULT_PASSWORD=change_me_immediately
    ports:
      - "${DASHBOARD_PORT:-7273}:3000"

networks:
  r2r-infra:
    external: true

volumes:
  hatchet_api_key:
    external: true
