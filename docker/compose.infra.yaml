# Shared infrastructure for multi-instance R2R deployments.
# Start once: docker compose -f compose.infra.yaml -p r2r-infra up -d --profile postgres --profile minio
#
# App instances (compose.app.yaml) connect via the r2r-infra network.

volumes:
  hatchet_certs:
    name: hatchet_certs
  hatchet_config:
    name: hatchet_config
  hatchet_api_key:
    name: hatchet_api_key
  hatchet_rabbitmq_data:
    name: hatchet_rabbitmq_data
  hatchet_rabbitmq_conf:
    name: hatchet_rabbitmq_conf
  hatchet_postgres_data:
    name: hatchet_postgres_data
  minio_data:
    name: minio_data
  postgres_data:
    name: postgres_data

networks:
  r2r-infra:
    name: r2r-infra
    driver: bridge

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    profiles: [postgres]
    env_file:
      - ./env/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks: [r2r-infra]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure
    command: >
      postgres
      -c max_connections=1024

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    profiles: [minio]
    env_file:
      - ./env/minio.env
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks: [r2r-infra]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure
    command: server /data --console-address ":9001"

  hatchet-postgres:
    image: postgres:latest@sha256:8ff36f3c66371cba71d20ceedccfc3de9669a68737607888c4ef0af93abe8e39
    env_file:
      - ./env/hatchet.env
    volumes:
      - hatchet_postgres_data:/var/lib/postgresql
    networks: [r2r-infra]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hatchet_user -d hatchet"]
      interval: 10s
      timeout: 5s
      retries: 5

  hatchet-rabbitmq:
    image: "rabbitmq:3-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69"
    hostname: "hatchet-rabbitmq"
    ports:
      - "5673:5672"
      - "15673:15672"
    env_file:
      - ./env/hatchet.env
    volumes:
      - hatchet_rabbitmq_data:/var/lib/rabbitmq
      - hatchet_rabbitmq_conf:/etc/rabbitmq/rabbitmq.conf
    networks: [r2r-infra]
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 5

  hatchet-create-db:
    image: postgres:latest@sha256:8ff36f3c66371cba71d20ceedccfc3de9669a68737607888c4ef0af93abe8e39
    command: sh /scripts/create-hatchet-db.sh
    volumes:
      - ./scripts:/scripts
    env_file:
      - ./env/hatchet.env
    networks: [r2r-infra]
    depends_on:
      hatchet-postgres:
        condition: service_healthy

  hatchet-migration:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-migrate:v0.53.15@sha256:e5d3857e4fe5111f569cfc9c44bba0ad3de7ee14414dd10a59e05c56eb1cdadb
    env_file:
      - ./env/hatchet.env
    networks: [r2r-infra]
    depends_on:
      hatchet-create-db:
        condition: service_completed_successfully

  hatchet-setup-config:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-admin:v0.53.15@sha256:cd3155e5d0ea852f689354c87c484af8547a740d464f76e801dc92a7b9d6d210
    command: /hatchet/hatchet-admin quickstart --skip certs --generated-config-dir /hatchet/config --overwrite=false
    env_file:
      - ./env/hatchet.env
    volumes:
      - hatchet_certs:/hatchet/certs
      - hatchet_config:/hatchet/config
    networks: [r2r-infra]
    depends_on:
      hatchet-migration:
        condition: service_completed_successfully
      hatchet-rabbitmq:
        condition: service_healthy

  hatchet-engine:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-engine:v0.53.15@sha256:7698a5bfe987940c338090d6b9894de3c61a699c67861afdc876fcf18645afb9
    command: /hatchet/hatchet-engine --config /hatchet/config
    restart: on-failure
    depends_on:
      hatchet-setup-config:
        condition: service_completed_successfully
    ports:
      - "7077:7077"
    env_file:
      - ./env/hatchet.env
    volumes:
      - hatchet_certs:/hatchet/certs
      - hatchet_config:/hatchet/config
    networks: [r2r-infra]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8733/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  hatchet-dashboard:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-dashboard:v0.53.15@sha256:0a36505cc0c12dee56a504dddb6c3f5038fc08be3d8e1ff275b2ea2b66cd4003
    command: sh ./entrypoint.sh --config /hatchet/config
    restart: on-failure
    depends_on:
      hatchet-setup-config:
        condition: service_completed_successfully
    env_file:
      - ./env/hatchet.env
    volumes:
      - hatchet_certs:/hatchet/certs
      - hatchet_config:/hatchet/config
    ports:
      - "7274:80"
    networks: [r2r-infra]

  setup-token:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-admin:v0.53.15@sha256:cd3155e5d0ea852f689354c87c484af8547a740d464f76e801dc92a7b9d6d210
    command: sh /scripts/setup-token.sh
    volumes:
      - ./scripts:/scripts
      - hatchet_certs:/hatchet/certs
      - hatchet_config:/hatchet/config
      - hatchet_api_key:/hatchet_api_key
    networks: [r2r-infra]
    depends_on:
      hatchet-setup-config:
        condition: service_completed_successfully
