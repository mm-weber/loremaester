# R2R config: Ollama embeddings only.
# No completion/LLM config — Claude Code handles all reasoning via MCP servers.

[embedding]
provider = "ollama"
base_model = "mxbai-embed-large"
base_dimension = 1_024
# Larger batches amortize Ollama's kernel-launch overhead; mxbai-embed-large
# is ~780 MB on GPU, batches of 128 still fit comfortably in VRAM.
batch_size = 128
# Was 2 — silent throughput cap on the embedding phase. Pair with
# OLLAMA_NUM_PARALLEL=4 on the Ollama systemd unit so these concurrent
# calls actually run in parallel server-side instead of queueing.
concurrent_request_limit = 8

[completion_embedding]
provider = "ollama"
base_model = "mxbai-embed-large"
base_dimension = 1_024
batch_size = 128
concurrent_request_limit = 8

[ingestion]
provider = "unstructured_local"
strategy = "auto"
chunking_strategy = "by_title"
new_after_n_chars = 384
max_characters = 512
combine_under_n_chars = 128
overlap = 20
skip_document_summary = true
automatic_extraction = false

[orchestration]
provider = "hatchet"

[app]
# Default PDF upload limit is 30MB. TTRPG sourcebooks (especially scanned
# multi-volume boxed sets) regularly exceed 300MB once reshaped
# through Unstructured, so cap is 500MB.
max_upload_size_by_type = { pdf = 500_000_000 }
