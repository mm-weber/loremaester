# R2R config: Light Mode — Ollama embeddings, no Hatchet, no Unstructured service.
#
# Pairs with docker/compose.yaml (the small Light stack: postgres + minio + r2r
# + dashboard). Claude Code handles all reasoning via MCP servers, so no
# completion/LLM provider is configured here.
#
# Differences from the Full-Mode config (r2r-ollama-embeddings.toml):
#   - [orchestration] provider = "simple"  -> in-process; no Hatchet/RabbitMQ
#   - [ingestion]     provider = "r2r"      -> built-in parser; no Unstructured
# Image-only/scanned PDFs are OCR'd client-side by scripts/ingest_books.py
# (pypdfium2 render + per-page tesseract/easyocr) and uploaded as text, so
# server-side OCR isn't needed.

[embedding]
provider = "ollama"
base_model = "mxbai-embed-large"
base_dimension = 1_024
# Kept small for a single, possibly shared GPU: the peak in-flight texts sent to
# Ollama is batch_size * concurrent_request_limit. Large values (e.g. 128 * 8)
# spike VRAM and can make Ollama fail with "model failed to load" on big books,
# especially when easyocr also holds the GPU. See docs/troubleshooting.md.
batch_size = 32
concurrent_request_limit = 2

[completion_embedding]
provider = "ollama"
base_model = "mxbai-embed-large"
base_dimension = 1_024
batch_size = 32
concurrent_request_limit = 2

[ingestion]
# Built-in R2R parsing — no Unstructured.io container required. Text-native PDFs
# parse directly; route image-only PDFs through scripts/ingest_books.py instead.
provider = "r2r"
# chunk_size/chunk_overlap are in CHARACTERS for the built-in parser. It does NOT
# read Unstructured's max_characters/new_after_n_chars (those apply only to Full
# Mode's unstructured_local provider). Keep chunks under mxbai-embed-large's
# 512-token window: the Ollama embedding path does not truncate oversized inputs,
# so a too-large chunk hard-fails with "input length exceeds the context length"
# (seen on dense OCR text, e.g. tsr02609). 512 chars mirrors Full Mode's
# max_characters; drop to 384 if an extreme-density chunk still exceeds.
chunk_size = 512
chunk_overlap = 64
chunking_strategy = "recursive"
# No completion provider is configured, so skip the LLM-dependent steps.
skip_document_summary = true
automatic_extraction = false

[orchestration]
# In-process — no Hatchet, RabbitMQ, or the wait-for-gRPC startup gate.
provider = "simple"

[app]
# TTRPG sourcebooks (scanned multi-volume boxed sets) can exceed the 30MB
# default once reshaped, so cap uploads at 500MB.
max_upload_size_by_type = { pdf = 500_000_000 }
